<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ilon O'yini</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Bosh Ekran -->
  <div id="homeScreen" class="home-screen">
    <div class="home-menu">
      <h1 class="game-title">ILON O'YINI</h1>
      <button id="resumeBtn" class="main-btn" data-i18n="resume">▶ Davom ettirish</button>
      <button id="newGameBtn" class="main-btn" data-i18n="newGame">🎮 Yangi o'yin</button>
      <button id="skinsBtn" class="main-btn" data-i18n="skinsMenu">🎨 Skinlar</button>
      <button id="achievementsBtn" class="main-btn" data-i18n="achievementsMenu">🏆 Yutuqlar</button>
      <button id="homeSettingsBtn" class="main-btn" data-i18n="settingsMenu">⚙️ Sozlamalar</button>
    </div>
  </div>

  <!-- Level Banner -->
  <div id="levelBanner" class="level-banner hidden">
    <span id="levelBannerText">LEVEL UP!</span>
  </div>

  <!-- Yuqori Asosiy Boshqaruv va Ma'lumot Paneli (Tartiblangan va Birlashtirilgan) -->
  <div id="topGamePanel" class="top-game-panel hidden">
    
    <!-- Chap tomon: Pauza va Level -->
    <div class="panel-left">
      <button id="pauseBtn" class="settings-btn square-btn" data-i18n="pauseBtn">⏸️</button>
      <div id="levelDisplay"><span data-i18n="level">DAROJA</span>: 1</div>
    </div>

    <!-- O'rta: Aktiv Bonus Taymeri -->
    <div id="topCenterTimer" class="top-center-timer hidden">
      <span id="timerLabel">⚡BONUS</span>: <span id="shieldSeconds">10</span>s
    </div>

    <!-- O'ng tomon: Achko va Rekord -->
    <div id="scoreBoard" class="score-board">
      <div><span data-i18n="highScore">Rekord</span>: <span id="highScore">0</span></div>
      <div><span data-i18n="score">Achko</span>: <span id="score">0</span></div>
    </div>

  </div>

  <!-- Pauza Oynasi -->
  <div id="pauseModal" class="modal hidden">
    <div class="modal-content">
      <h2 data-i18n="pauseTitle">⏸️ PAUZA</h2>
      <button id="pauseResumeBtn" class="menu-action-btn primary-action" data-i18n="resume">▶ Davom ettirish</button>
      <button id="pauseRestartBtn" class="menu-action-btn restart-action" data-i18n="restart">🔄 Qayta boshlash</button>
      <button id="pauseHomeBtn" class="menu-action-btn home-action" data-i18n="home">🏠 Bosh ekran</button>
    </div>
  </div>

  <!-- Sozlamalar Oynasi -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <button id="homeBtn" class="menu-action-btn home-action" data-i18n="home">🏠 Bosh ekran</button>
      <button id="restartBtn" class="menu-action-btn restart-action" data-i18n="restart">🔄 Qayta boshlash</button>
      <button id="soundToggleBtn" class="menu-action-btn sound-action" data-i18n="soundOn">🔊 Ovoz: Yoqilgan</button>
      
      <hr class="divider">
      <h2 data-i18n="languageTitle">Tilni Tanlash</h2>
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="uz">🇺🇿 UZ</button>
        <button class="lang-btn" data-lang="ru">🇷🇺 RU</button>
        <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
      </div>

      <hr class="divider">
      <h2 data-i18n="difficultyTitle">Qiyinlik Darajasi</h2>
      <button class="diff-btn active" data-diff="easy" data-i18n="diffEasy">Oson</button>
      <button class="diff-btn" data-diff="medium" data-i18n="diffMedium">O'rtacha</button>
      <button class="diff-btn" data-diff="hard" data-i18n="diffHard">Qiyin</button>
      <button class="diff-btn danger" data-diff="super" data-i18n="diffSuper">☠️ Super Qiyin</button>
      <button id="closeSettings" class="close-btn" data-i18n="close">Yopish</button>
    </div>
  </div>

  <!-- Skinlar Oynasi -->
  <div id="skinsModal" class="modal hidden">
    <div class="modal-content">
      <h2 data-i18n="skinsTitle">🎨 Ilon Skinlari</h2>
      <div class="skins-list">
        <button class="skin-btn active" data-skin="neon" data-i18n="skinNeon">🟢 Neon Ko'k</button>
        <button class="skin-btn" data-skin="fire" data-i18n="skinFire">🔥 Olovli Qizil</button>
        <button class="skin-btn" data-skin="rainbow" data-i18n="skinRainbow">🌈 Kamalak</button>
        <button class="skin-btn" data-skin="gold" data-i18n="skinGold">⭐ Oltin</button>
      </div>
      <button id="closeSkins" class="close-btn" data-i18n="close">Yopish</button>
    </div>
  </div>

  <!-- Yutuqlar Oynasi -->
  <div id="achievementsModal" class="modal hidden">
    <div class="modal-content">
      <h2 data-i18n="achievementsTitle">🏆 Yutuqlar</h2>
      <div class="achievements-list">
        <div id="ach1" data-i18n="ach1_text">🔒 Yangi boshlovchi (10 ochko)</div>
        <div id="ach2" data-i18n="ach2_text">🔒 Ilon ustasi (50 ochko)</div>
        <div id="ach3" data-i18n="ach3_text">🔒 Chaqqon ovchi (100 ochko)</div>
      </div>
      <button id="closeAchievements" class="close-btn" data-i18n="close">Yopish</button>
    </div>
  </div>

  <!-- Dinamik Joystik -->
  <div id="dynamicJoystick" class="dynamic-joystick hidden">
    <div class="joystick-base">
      <div id="joystickStick" class="joystick-stick"></div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
